name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stampp
          POSTGRES_PASSWORD: stampp
          POSTGRES_DB: stampp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stampp -d stampp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      DATABASE_URL: postgres://stampp:stampp@localhost:5432/stampp
      VALKEY_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000
      MAIL_FROM: Stampp CI <ci@localhost>
      MAIL_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Load env schemas
        run: |
          pnpm exec varlock load --path apps/api
          pnpm exec varlock load --path apps/web

      - name: Check formatting and lint
        run: vp run check

      - name: Typecheck
        run: vp run -r typecheck

      - name: Run tests
        run: vp run test

      - name: Build
        run: vp run -r build
