name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      DATABASE_URL: postgres://stampp:stampp@localhost:5432/stampp
      VALKEY_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000
      MAIL_FROM: Stampp CI <ci@localhost>
      MAIL_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Validate API env schema
        uses: dmno-dev/varlock-action@v1.0.1
        with:
          working-directory: apps/api
          show-summary: 'true'
          fail-on-error: 'true'

      - name: Validate web env schema
        uses: dmno-dev/varlock-action@v1.0.1
        with:
          working-directory: apps/web
          show-summary: 'true'
          fail-on-error: 'true'

      - name: Audit schema and code drift
        run: |
          pnpm exec varlock audit --path apps/api
          pnpm exec varlock audit --path apps/web

      - name: Check codegen drift
        run: |
          pnpm exec varlock codegen --path apps/api
          git diff --exit-code -- apps/api/env.ts

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$package_version." >&2
            exit 1
          fi

      - name: Check, typecheck, test, and build
        run: |
          vp run check
          vp run -r typecheck
          vp run test
          vp run -r build

      - name: Create or sync Release
        env:
          GENBUMPPUSH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec genbumppush --retry-github "${{ github.ref_name }}" --yes
