services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stampp
      POSTGRES_PASSWORD: stampp
      POSTGRES_DB: stampp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stampp -d stampp']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    profiles: ['mail']
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  valkey-data:
