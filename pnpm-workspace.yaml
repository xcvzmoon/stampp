packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@oxlint/plugins': 1.82.0
  '@types/node': ^26.6.1
  genbumppush: ^0.0.7
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2

catalogs:
  auth:
    better-auth: 1.7.5
    '@better-auth/drizzle-adapter': 1.7.5
  db:
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
    postgres: 3.4.9
  mail:
    unemail: 0.7.0
  platform:
    bullmq: 6.3.6
    ioredis: 5.10.0
    uuid: 14.0.2
    valibot: 1.5.0
    varlock: 1.19.0
  ui:
    '@golar/vue': ^0.1.10
    '@iconify-json/lucide': ^1.2.131
    '@iconify-json/lucide-lab': ^1.2.3
    '@nuxt/ui': ^4.11.1
    '@oxlint/plugins': ^1.82.0
    '@pinia/nuxt': 1.0.2
    '@vueuse/core': ^14.4.0
    '@vueuse/nuxt': ^14.4.0
    golar: ^0.1.10
    nuxt: ^4.5.2
    pinia: ^4.0.3
    pinia-plugin-persistedstate: ^4.7.1
    tailwindcss: ^4.3.3
    vue: ^3.5.42
    vue-router: ^5.3.1
    vue-tsc: ^3.3.11
  api:
    nitro: 3.0.260903-beta

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@types/node@26.6.1'
  - genbumppush@0.0.7
